# XcodeGen project for the v2 (App Store) build.
# Generate the .xcodeproj with:  xcodegen generate   (brew install xcodegen)
# The v1 Developer-ID DMG build is unaffected — it still uses build.sh/package.sh.
#
# The .xcodeproj is generated and gitignored; this file is the source of truth.
name: Free
options:
  bundleIdPrefix: com.benni
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  FreeLogic:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: YVZG5QKT42
    # Manual Developer ID signing: a Network Extension system extension needs
    # Developer-ID provisioning profiles that grant the
    # content-filter-provider-systemextension entitlement (auto-signing can't
    # generate these). Notarized Developer-ID builds also activate with SIP on.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Free:
    type: application
    platform: macOS
    sources:
      - Sources/FreeAppStore
    dependencies:
      - package: FreeLogic
        product: FreeLogic
      - target: ContentFilterExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benni.Free
        INFOPLIST_FILE: Support/FreeAppStore-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Free.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "Free DevID"

  ContentFilterExtension:
    # System extension: on macOS content filters MUST run as system extensions
    # (the app-extension filter-data point doesn't exist on macOS). The app
    # installs/activates it via OSSystemExtensionRequest; requires the app to run
    # from /Applications and the user to approve it in System Settings.
    type: system-extension
    platform: macOS
    sources:
      - Sources/ContentFilter
    dependencies:
      - package: FreeLogic
        product: FreeLogic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benni.Free.ContentFilter
        INFOPLIST_FILE: Sources/ContentFilter/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/ContentFilter.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "Free CF DevID"

# Explicit shared scheme so ⌘R unambiguously runs the Free app (building the app
# also builds + embeds the extension via the target dependency). Without this,
# Xcode auto-selects the alphabetically-first target — the non-runnable extension.
schemes:
  Free:
    build:
      targets:
        Free: all
    run:
      config: Debug
    archive:
      config: Release
